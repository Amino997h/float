<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>علامة تبويب جديدة - Float</title>
<style>
  :root {
    --bg-page: #f8f9fa;
    --card-bg: #ffffff;
    --card-hover: #f1f3f4;
    --text-primary: #202124;
    --text-secondary: #5f6368;
    --border: #dfe1e5;
    --shadow: 0 1px 6px rgba(32,33,36,0.12);
    --shadow-hover: 0 4px 14px rgba(32,33,36,0.18);
    --primary: #1a73e8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #202124;
      --card-bg: #292a2d;
      --card-hover: #35363a;
      --text-primary: #e8eaed;
      --text-secondary: #9aa0a6;
      --border: #3c4043;
      --shadow: 0 1px 6px rgba(0,0,0,0.3);
      --shadow-hover: 0 4px 14px rgba(0,0,0,0.45);
      --primary: #8ab4f8;
    }
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 10vh;
    user-select: none;
    transition: background-color 0.2s;
  }

  /* Floating brand header */
  .brand-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
    animation: fadeInDown 0.4s ease-out;
  }

  .brand-logo-wrap {
    position: relative;
    width: 82px;
    height: 82px;
    border-radius: 22px;
    background: #ffffff;
    box-shadow: 0 8px 24px rgba(26, 115, 232, 0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .brand-logo-wrap:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 12px 28px rgba(26, 115, 232, 0.24);
  }

  .brand-logo-wrap img {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    object-fit: cover;
  }

  .brand-title {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #1a73e8, #4285f4, #0d47a1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-tag {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
    background: rgba(26, 115, 232, 0.1);
    color: var(--primary);
    -webkit-text-fill-color: initial;
    letter-spacing: 0.5px;
  }

  /* Search Bar */
  .search-wrapper {
    width: 100%;
    max-width: 640px;
    margin-bottom: 40px;
    position: relative;
    animation: fadeInUp 0.4s ease-out;
  }

  .search-box {
    width: 100%;
    height: 52px;
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 26px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 14px;
    box-shadow: var(--shadow);
    transition: all 0.2s ease;
  }

  .search-box:hover,
  .search-box:focus-within {
    box-shadow: var(--shadow-hover);
    border-color: transparent;
  }

  .search-icon {
    width: 20px;
    height: 20px;
    fill: var(--text-secondary);
    flex-shrink: 0;
  }

  .search-input {
    flex-grow: 1;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 16px;
    color: var(--text-primary);
  }

  .search-btn {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--primary);
    font-size: 13.5px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 16px;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .search-btn:hover {
    background: rgba(26, 115, 232, 0.08);
  }

  /* Shortcuts Section */
  .shortcuts-container {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeInUp 0.5s ease-out;
  }

  .shortcuts-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .shortcuts-grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 16px;
    justify-items: center;
  }

  .shortcut-card {
    position: relative;
    width: 110px;
    height: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    cursor: pointer;
    transition: background-color 0.15s, transform 0.15s;
    text-decoration: none;
    color: var(--text-primary);
    padding: 8px 4px;
  }

  .shortcut-card:hover {
    background-color: var(--card-hover);
    transform: translateY(-2px);
  }

  .shortcut-icon-wrap {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    position: relative;
    overflow: hidden;
    transition: transform 0.15s;
  }

  .shortcut-card:hover .shortcut-icon-wrap {
    transform: scale(1.06);
  }

  .shortcut-favicon {
    width: 26px;
    height: 26px;
    border-radius: 4px;
    object-fit: contain;
  }

  .shortcut-letter {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
  }

  .shortcut-title {
    width: 96px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-primary);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .shortcut-remove {
    position: absolute;
    top: 4px;
    left: 4px; /* in RTL, top left */
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 11px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
    z-index: 10;
  }

  .shortcut-remove:hover {
    background: #e81123;
    transform: scale(1.1);
  }

  .shortcut-card:hover .shortcut-remove {
    display: flex;
  }

  /* Add button card */
  .shortcut-add {
    border: 1px dashed var(--border);
  }

  .shortcut-add:hover {
    border-color: var(--primary);
  }

  .shortcut-add .shortcut-icon-wrap {
    background: transparent;
    border: 1px dashed var(--border);
  }

  .shortcut-add svg {
    width: 24px;
    height: 24px;
    fill: var(--text-secondary);
    transition: fill 0.15s;
  }

  .shortcut-add:hover svg {
    fill: var(--primary);
  }

  /* Modal Dialog */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.4);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.active {
    display: flex;
  }

  .modal-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 90%;
    max-width: 420px;
    padding: 24px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: zoomIn 0.2s ease-out;
  }

  .modal-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .input-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .modal-input {
    width: 100%;
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-primary);
    padding: 0 12px;
    font-size: 14px;
    outline: none;
    direction: ltr;
    text-align: right;
    transition: border-color 0.15s;
  }

  .modal-input:focus {
    border-color: var(--primary);
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 8px;
  }

  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: background 0.15s;
  }

  .btn-secondary {
    background: var(--card-hover);
    color: var(--text-primary);
  }

  .btn-secondary:hover {
    background: var(--border);
  }

  .btn-primary {
    background: var(--primary);
    color: #ffffff;
  }

  .btn-primary:hover {
    opacity: 0.9;
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes zoomIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

  <!-- Floating Brand Header -->
  <div class="brand-container">
    <div class="brand-logo-wrap">
      <img src="app_64.png" alt="Float Browser">
    </div>
    <div class="brand-title">
      Float
      <span class="brand-tag">خفيف وسريع</span>
    </div>
  </div>

  <!-- Google Search Box -->
  <div class="search-wrapper">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24">
        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="ابحث في Google أو اكتب عنوان الموقع (URL)" autofocus autocomplete="off">
      <button class="search-btn" onclick="doSearch()">بحث</button>
    </div>
  </div>

  <!-- Shortcuts Grid -->
  <div class="shortcuts-container">
    <div class="shortcuts-header">
      <span>المواقع المثبتة والمفضلة</span>
      <span id="shortcuts-count" style="font-size: 12px; font-weight: normal;"></span>
    </div>
    <div class="shortcuts-grid" id="shortcuts-grid">
      <!-- Generated dynamically -->
    </div>
  </div>

  <!-- Add Shortcut Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal-card">
      <div class="modal-title">إضافة موقع إلى المفضلة</div>
      <div class="input-group">
        <label class="input-label">اسم الموقع:</label>
        <input type="text" id="site-name" class="modal-input" placeholder="مثال: YouTube أو Twitter" style="text-align: right;">
      </div>
      <div class="input-group">
        <label class="input-label">رابط الموقع (URL):</label>
        <input type="text" id="site-url" class="modal-input" placeholder="https://example.com" style="text-align: left; direction: ltr;">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
        <button class="btn btn-primary" onclick="saveNewShortcut()">إضافة الموقع</button>
      </div>
    </div>
  </div>

<script>
  // Default popular shortcuts
  const DEFAULT_SHORTCUTS = [
    { title: "Google", url: "https://www.google.com", favicon: "https://www.google.com/favicon.ico" },
    { title: "YouTube", url: "https://www.youtube.com", favicon: "https://www.youtube.com/favicon.ico" },
    { title: "GitHub", url: "https://github.com", favicon: "https://github.com/favicon.ico" },
    { title: "Twitter / X", url: "https://x.com", favicon: "https://abs.twimg.com/favicons/twitter.3.ico" },
    { title: "Wikipedia", url: "https://www.wikipedia.org", favicon: "https://www.wikipedia.org/static/favicon/wikipedia.ico" }
  ];

  let bookmarks = [];

  function emit(msg) {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(msg);
    }
  }

  // Load bookmarks: from localStorage first for instant display
  function initBookmarks() {
    try {
      const cached = localStorage.getItem('float_bookmarks');
      if (cached) {
        bookmarks = JSON.parse(cached);
      } else {
        bookmarks = DEFAULT_SHORTCUTS;
      }
    } catch (e) {
      bookmarks = DEFAULT_SHORTCUTS;
    }
    renderShortcuts();
    // Request authoritative sync from C++ backend
    emit('GET_BOOKMARKS');
  }

  // Called by C++ shell to provide up-to-date bookmarks list
  window.loadBookmarksData = function(data) {
    if (Array.isArray(data) && data.length > 0) {
      bookmarks = data;
    } else if (Array.isArray(data) && data.length === 0) {
      bookmarks = DEFAULT_SHORTCUTS;
    }
    try {
      localStorage.setItem('float_bookmarks', JSON.stringify(bookmarks));
    } catch (e) {}
    renderShortcuts();
  };

  const INLINE_SVGS = {
    'google': '<svg viewBox="0 0 24 24" width="28" height="28"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>',
    'youtube': '<svg viewBox="0 0 24 24" width="28" height="28"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
    'github': '<svg viewBox="0 0 24 24" width="28" height="28" fill="#24292e"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>',
    'twitter': '<svg viewBox="0 0 24 24" width="24" height="24" fill="#000000"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
    'x.com': '<svg viewBox="0 0 24 24" width="24" height="24" fill="#000000"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
    'wikipedia': '<svg viewBox="0 0 24 24" width="28" height="28" fill="#333333"><path d="M12.09 13.12L9.04 4.02H6.92L1.87 18.27h2.18l1.3-3.79h4.94l.87 2.65c.29.89.5 1.14 1.21 1.14h2.24l-2.52-5.15zm-4.71-.58l1.66-4.95 1.66 4.95H7.38zm14.75 5.73l-4.52-12.8h-2.12l-1.39 3.96 2.37 6.77-2.61 7.42h2.23l1.55-4.43h5.05l.93 2.76c.26.79.47 1.02 1.16 1.02h2.28l-4.93-4.7zm-3.84-2.52l1.7-4.85 1.68 4.85h-3.38z"/></svg>'
  };

  function getInlineSvg(url) {
    if (!url) return null;
    const lower = url.toLowerCase();
    for (const k in INLINE_SVGS) {
      if (lower.includes(k)) return INLINE_SVGS[k];
    }
    return null;
  }

  function renderShortcuts() {
    const grid = document.getElementById('shortcuts-grid');
    grid.innerHTML = '';

    bookmarks.forEach((bm, idx) => {
      const card = document.createElement('div');
      card.className = 'shortcut-card';
      card.title = bm.title + '\n' + bm.url;
      card.onclick = (e) => {
        if (!e.target.classList.contains('shortcut-remove')) {
          openUrl(bm.url);
        }
      };

      const removeBtn = document.createElement('div');
      removeBtn.className = 'shortcut-remove';
      removeBtn.innerHTML = '✕';
      removeBtn.title = 'إزالة من المفضلة';
      removeBtn.onclick = (e) => {
        e.stopPropagation();
        removeBookmark(idx);
      };

      const iconWrap = document.createElement('div');
      iconWrap.className = 'shortcut-icon-wrap';

      const svgIcon = getInlineSvg(bm.url);
      if (svgIcon) {
        iconWrap.innerHTML = svgIcon;
      } else {
        const favicon = document.createElement('img');
        favicon.className = 'shortcut-favicon';
        favicon.src = bm.favicon || getFaviconUrl(bm.url);
        favicon.onerror = () => {
          favicon.style.display = 'none';
          const letter = document.createElement('div');
          letter.className = 'shortcut-letter';
          letter.innerText = (bm.title && bm.title.trim() ? bm.title.trim()[0].toUpperCase() : '★');
          iconWrap.appendChild(letter);
        };
        iconWrap.appendChild(favicon);
      }

      const title = document.createElement('div');
      title.className = 'shortcut-title';
      title.innerText = bm.title || 'موقع';

      card.appendChild(removeBtn);
      card.appendChild(iconWrap);
      card.appendChild(title);
      grid.appendChild(card);
    });

    // Add Shortcut Button
    const addCard = document.createElement('div');
    addCard.className = 'shortcut-card shortcut-add';
    addCard.title = 'إضافة موقع جديد';
    addCard.onclick = openModal;

    const addIconWrap = document.createElement('div');
    addIconWrap.className = 'shortcut-icon-wrap';
    addIconWrap.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>';

    const addTitle = document.createElement('div');
    addTitle.className = 'shortcut-title';
    addTitle.innerText = 'إضافة موقع';

    addCard.appendChild(addIconWrap);
    addCard.appendChild(addTitle);
    grid.appendChild(addCard);

    document.getElementById('shortcuts-count').innerText = bookmarks.length + ' مواقع';
  }

  function getFaviconUrl(url) {
    try {
      const u = new URL(url);
      return u.origin + '/favicon.ico';
    } catch (e) {
      return 'https://www.google.com/favicon.ico';
    }
  }

  function openUrl(url) {
    emit('NAV:' + url);
  }

  function removeBookmark(idx) {
    const item = bookmarks[idx];
    if (item) {
      bookmarks.splice(idx, 1);
      renderShortcuts();
      try {
        localStorage.setItem('float_bookmarks', JSON.stringify(bookmarks));
      } catch (e) {}
      emit('REMOVE_BOOKMARK:' + item.url);
    }
  }

  function openModal() {
    document.getElementById('site-name').value = '';
    document.getElementById('site-url').value = '';
    document.getElementById('add-modal').classList.add('active');
    setTimeout(() => document.getElementById('site-name').focus(), 100);
  }

  function closeModal() {
    document.getElementById('add-modal').classList.remove('active');
  }

  function saveNewShortcut() {
    let title = document.getElementById('site-name').value.trim();
    let url = document.getElementById('site-url').value.trim();

    if (!url) {
      alert('يرجى إدخال رابط الموقع (URL)');
      return;
    }

    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      url = 'https://' + url;
    }

    if (!title) {
      try {
        title = new URL(url).hostname.replace('www.', '');
      } catch (e) {
        title = 'موقع جديد';
      }
    }

    const fav = getFaviconUrl(url);
    const newBm = { title, url, favicon: fav };

    bookmarks.push(newBm);
    renderShortcuts();
    try {
      localStorage.setItem('float_bookmarks', JSON.stringify(bookmarks));
    } catch (e) {}

    // Send to C++
    emit('ADD_BOOKMARK:' + JSON.stringify(newBm));
    closeModal();
  }

  // Search Logic
  function doSearch() {
    const val = document.getElementById('search-input').value.trim();
    if (!val) return;

    // Check if it's a direct URL
    const isUrl = val.startsWith('http://') || val.startsWith('https://') ||
                  (val.includes('.') && !val.includes(' ') && val.length > 3);

    if (isUrl) {
      const target = (val.startsWith('http://') || val.startsWith('https://')) ? val : ('https://' + val);
      emit('NAV:' + target);
    } else {
      emit('NAV:https://www.google.com/search?q=' + encodeURIComponent(val));
    }
  }

  document.getElementById('search-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      doSearch();
    }
  });

  // Modal ESC handler
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  initBookmarks();
</script>
</body>
</html>
